{% extends "base.html" %}
{% block title %}Enter authenticator code{% endblock %}
{% block content %}
<h2>Enter your authenticator code</h2>
<p class="muted">Open your authenticator app and enter the current 6-digit code.</p>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="totp_code">6-digit code</label>
  <input id="totp_code" name="totp_code" class="code-input" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" required>
  <button class="btn" type="submit">Verify</button>
</form>
<p class="muted center"><a href="{{ url_for('logout') }}">Cancel and log out</a></p>
{% endblock %}
