{% extends "base.html" %}
{% block title %}Verify your email{% endblock %}
{% block content %}
<h2>Verify your email</h2>
<p class="muted">We sent a 6-digit code to {{ masked_email }}. It expires in 10 minutes.</p>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="code">Verification code</label>
  <input id="code" name="code" class="code-input" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" required>
  <button class="btn" type="submit">Verify email</button>
</form>
<form method="post" action="{{ url_for('resend_register_email') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="btn btn-secondary" type="submit">Send a new code</button>
</form>
<form method="post" action="{{ url_for('cancel_setup') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="btn btn-secondary" type="submit">Wrong email? Start over</button>
</form>
{% endblock %}
