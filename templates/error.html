<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0816">
    <meta name="robots" content="noindex">
    <title>{{ code }} · {{ title }} - Secure Login Testing</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-error">
    <div class="bg" aria-hidden="true">
        <span class="bg-orb o1"></span>
        <span class="bg-orb o2"></span>
        <span class="bg-grid"></span>
    </div>

    <header class="topbar">
        <a class="brand" href="{{ url_for('login') }}" aria-label="Secure Login Testing home">
            <span class="brand-mark">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </span>
            <span class="brand-name">Secure Login</span>
        </a>
    </header>

    <main class="shell">
        <section class="auth">
            <div class="card err-card" data-tone="{{ tone }}">
                <div class="card-in stg">
                    <div class="hero-ic">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                            {% if icon == 'compass' %}
                            <circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/>
                            {% elif icon == 'lock' %}
                            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            {% elif icon == 'clock' %}
                            <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                            {% elif icon == 'server' %}
                            <rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/>
                            {% else %}
                            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>
                            {% endif %}
                        </svg>
                    </div>
                    <p class="err-code" aria-hidden="true">{{ code }}</p>
                    <h1>{{ title }}</h1>
                    <p class="sub">{{ message }}</p>
                    <a href="{{ url_for('login') }}" class="btn btn-primary btn-block">Back to home</a>
                    <p class="err-hint">Error {{ code }}</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="foot">Secure Login Testing</footer>
</body>
</html>
