{% extends "base.html" %}
{% block title %}Verify with passkey{% endblock %}
{% block content %}
<h2>Verify with your passkey</h2>
<p class="muted">Confirm it's you with your fingerprint, face, or screen lock.</p>
<div id="passkey-root" data-mode="authenticate"
     data-begin="{{ url_for('passkey_authenticate_begin') }}"
     data-complete="{{ url_for('passkey_authenticate_complete') }}"
     data-next="{{ url_for('dashboard') }}">
  <button class="btn" type="button">Use passkey</button>
  <p class="status" role="status"></p>
</div>
<p class="muted center"><a href="{{ url_for('logout') }}">Cancel and log out</a></p>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/passkey.js') }}" nonce="{{ csp_nonce }}"></script>{% endblock %}
